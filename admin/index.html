<!DOCTYPE html>

<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Painel — Rodrigo Fotografia</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #121110;
      --panel: #1a1815;
      --panel-soft: #211f1b;
      --text: #ece8e0;
      --muted: #a39c8e;
      --accent: #ab8f63;
      --border: rgba(236, 232, 224, 0.12);
      --danger: #b8756d;
      --success: #8fa77d;
      --radius: 4px;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, Arial, sans-serif;
      padding: 32px 20px 60px;
    }

    button,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .admin {
      width: min(1100px, 100%);
      margin: 0 auto;
    }

    /* =====================================================
       CABEÇALHO
    ===================================================== */

    .admin-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 30px;
      margin-bottom: 40px;
    }

    .header-text h1 {
      margin: 0 0 8px;
      font-family: Georgia, serif;
      font-weight: 400;
      font-size: clamp(2rem, 4vw, 2.7rem);
      letter-spacing: -0.02em;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
    }

    #logout-button {
      flex-shrink: 0;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      padding: 10px 18px;
      transition: 0.25s ease;
    }

    #logout-button:hover {
      border-color: var(--accent);
      color: var(--text);
    }

    /* =====================================================
       PAINEL
    ===================================================== */

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      padding: clamp(22px, 4vw, 38px);
    }

    .section-header {
      margin-bottom: 26px;
    }

    .section-header h2 {
      margin: 0 0 8px;
      font-family: Georgia, serif;
      font-weight: 400;
      font-size: 1.55rem;
    }

    .section-header p {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
    }

    /* =====================================================
       UPLOAD
    ===================================================== */

    .upload-box {
      padding: 26px;
      border: 1px solid var(--border);
      background: var(--panel-soft);
    }

    .upload-controls {
      display: grid;
      grid-template-columns: minmax(180px, 260px) auto;
      align-items: end;
      gap: 18px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .field label {
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 0.03em;
    }

    select {
      width: 100%;
      border: 1px solid rgba(236, 232, 224, 0.18);
      background: var(--bg);
      color: var(--text);
      padding: 12px 14px;
      outline: none;
      border-radius: var(--radius);
    }

    select:focus {
      border-color: var(--accent);
    }

    #upload_widget {
      border: 1px solid var(--accent);
      background: transparent;
      color: var(--text);
      padding: 12px 24px;
      min-height: 45px;
      transition: 0.25s ease;
    }

    #upload_widget:hover {
      background: var(--accent);
      color: var(--bg);
    }

    #upload_widget:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #status {
      min-height: 22px;
      margin-top: 18px;
      color: var(--muted);
      font-size: 14px;
    }

    /* =====================================================
       PREVIEW DO UPLOAD
    ===================================================== */

    .uploaded-image {
      display: none;
      margin-top: 24px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
    }

    .uploaded-image img {
      display: block;
      width: 180px;
      max-width: 100%;
      height: auto;
    }

    .uploaded-image p {
      margin: 10px 0 0;
      color: var(--muted);
      word-break: break-word;
      font-size: 13px;
    }

    #image_url {
      display: none;
    }

    /* =====================================================
       DIVISOR
    ===================================================== */

    .divider {
      height: 1px;
      margin: 42px 0;
      background: var(--border);
      border: 0;
    }

    /* =====================================================
       FOTOS CADASTRADAS
    ===================================================== */

    .photos-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 24px;
    }

    .photos-header h2 {
      margin: 0;
      font-family: Georgia, serif;
      font-weight: 400;
      font-size: 1.55rem;
    }

    #photos-list {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
    }

    .photo-card {
      min-width: 0;
      border: 1px solid var(--border);
      background: var(--panel-soft);
      overflow: hidden;
    }

    .photo-preview {
      width: 100%;
      aspect-ratio: 4 / 3;
      background: #0e0d0c;
      overflow: hidden;
    }

    .photo-preview img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .photo-content {
      padding: 18px;
    }

    .photo-filename {
      margin: 0 0 16px;
      color: var(--text);
      font-size: 14px;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .photo-field {
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin-bottom: 14px;
    }

    .photo-field label {
      color: var(--muted);
      font-size: 12px;
    }

    .photo-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 18px;
    }

    .save-photo,
    .delete-photo {
      min-height: 40px;
      padding: 9px 10px;
      border-radius: var(--radius);
      transition: 0.25s ease;
    }

    .save-photo {
      border: 1px solid var(--accent);
      background: var(--accent);
      color: var(--bg);
    }

    .save-photo:hover {
      opacity: 0.85;
    }

    .delete-photo {
      border: 1px solid rgba(184, 117, 109, 0.55);
      background: transparent;
      color: var(--danger);
    }

    .delete-photo:hover {
      background: var(--danger);
      color: var(--bg);
    }

    .save-photo:disabled,
    .delete-photo:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* =====================================================
       ESTADOS
    ===================================================== */

    .empty-state,
    .loading-state,
    .error-state {
      grid-column: 1 / -1;
      padding: 30px 20px;
      border: 1px solid var(--border);
      color: var(--muted);
      text-align: center;
    }

    /* =====================================================
       RESPONSIVO
    ===================================================== */

    @media (max-width: 850px) {

      #photos-list {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

    }

    @media (max-width: 650px) {

      body {
        padding: 22px 14px 40px;
      }

      .admin-header {
        align-items: flex-start;
        flex-direction: column;
        gap: 20px;
        margin-bottom: 28px;
      }

      #logout-button {
        width: 100%;
      }

      .panel {
        padding: 18px;
      }

      .upload-box {
        padding: 18px;
      }

      .upload-controls {
        grid-template-columns: 1fr;
      }

      #upload_widget {
        width: 100%;
      }

      #photos-list {
        grid-template-columns: 1fr;
      }

      .photo-actions {
        grid-template-columns: 1fr;
      }

    }
  </style>

</head>

<body>

  <main class="admin">

<header class="admin-header">

  <div class="header-text">
    <h1>Painel do fotógrafo</h1>

    <p class="subtitle">
      Gerenciamento de fotos — Rodrigo Fotografia
    </p>
  </div>

  <button id="logout-button" type="button">
    Sair
  </button>

</header>


<section class="panel">

  <!-- ===================================================
       ADICIONAR FOTOS
  ==================================================== -->

  <div class="section-header">

    <h2>Adicionar fotos</h2>

    <p>
      Escolha a categoria e envie uma ou várias imagens.
    </p>

  </div>


  <div class="upload-box">

    <div class="upload-controls">

      <div class="field">

        <label for="photo_category">
          Categoria
        </label>

        <select id="photo_category">

          <option value="eventos">
            Eventos
          </option>

          <option value="esportes">
            Esportes
          </option>

          <option value="retratos">
            Retratos
          </option>

        </select>

      </div>


      <button id="upload_widget" type="button">
        + Adicionar fotos
      </button>

      <input
  id="photo_files"
  type="file"
  accept="image/jpeg,image/png,image/webp"
  multiple
  hidden
>
    </div>


    <div id="status"></div>


    <div class="uploaded-image" id="uploaded_image">

      <img
        id="preview"
        src=""
        alt="Foto enviada"
      >

      <p id="image_info"></p>

      <p>
        <strong>URL da imagem:</strong><br>
        <span id="image_url"></span>
      </p>

    </div>

  </div>


  <hr class="divider">


  <!-- ===================================================
       FOTOS CADASTRADAS
  ==================================================== -->

  <div class="photos-header">

    <h2>Fotos cadastradas</h2>

  </div>


  <div id="photos-list">

    <div class="loading-state">
      Carregando fotos...
    </div>

  </div>

</section>

  </main>

  <!-- =====================================================
       JAVASCRIPT
  ====================================================== -->

  <script type="module">

    import {
      logout
    } from "https://esm.sh/@netlify/identity";


    /* =====================================================
       LOGOUT
    ===================================================== */

    const logoutButton =
      document.getElementById("logout-button");


    logoutButton.addEventListener("click", async () => {

      await logout();

      window.location.href = "/login/";

    });


    /* =====================================================
       ELEMENTOS
    ===================================================== */

    const status =
      document.getElementById("status");

    const uploadedImage =
      document.getElementById("uploaded_image");

    const preview =
      document.getElementById("preview");

    const imageInfo =
      document.getElementById("image_info");

    const imageUrl =
      document.getElementById("image_url");

    const photoCategory =
      document.getElementById("photo_category");


   /* =====================================================
   R2 UPLOAD
===================================================== */

const uploadButton =
  document.getElementById("upload_widget");

const photoFiles =
  document.getElementById("photo_files");


uploadButton.addEventListener(
  "click",
  () => {

    photoFiles.click();

  }
);


photoFiles.addEventListener(
  "change",
  async () => {

    const files =
      Array.from(photoFiles.files);

    if (!files.length) {
      return;
    }


    if (files.length > 20) {

      alert(
        "Você pode enviar no máximo 20 fotos por vez."
      );

      photoFiles.value = "";

      return;

    }


    uploadButton.disabled = true;


    try {

      for (
        let i = 0;
        i < files.length;
        i++
      ) {

        const file =
          files[i];


        status.textContent =
          `Preparando foto ${i + 1} de ${files.length}...`;


        /* =============================================
           1. PEDIR URL TEMPORÁRIA AO NETLIFY
        ============================================= */

        const prepareResponse =
          await fetch(
            "/.netlify/functions/upload-r2",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({

                filename:
                  file.name,

                contentType:
                  file.type

              })

            }
          );


        const prepareData =
          await prepareResponse.json();


        if (
          !prepareResponse.ok ||
          !prepareData.success
        ) {

          throw new Error(
            prepareData.message ||
            "Não foi possível preparar o upload."
          );

        }


        /* =============================================
           2. ENVIAR ARQUIVO DIRETAMENTE PARA O R2
        ============================================= */

        status.textContent =
          `Enviando ${i + 1} de ${files.length}: ${file.name}`;


        const uploadResponse =
          await fetch(
            prepareData.uploadUrl,
            {
              method: "PUT",

              headers: {
                "Content-Type":
                  file.type
              },

              body: file

            }
          );


        if (!uploadResponse.ok) {

          throw new Error(
            `Erro ao enviar ${file.name} para o R2.`
          );

        }


        /* =============================================
           3. SALVAR METADADOS NO NETLIFY BLOBS
        ============================================= */

        status.textContent =
          `Cadastrando ${i + 1} de ${files.length}: ${file.name}`;


        const saveResponse =
          await fetch(
            "/.netlify/functions/save-photo",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({

                id:
                  prepareData.key,

                image:
                  prepareData.publicUrl,

                filename:
                  file.name,

                category:
                  photoCategory.value,

                size:
                  "",

                alt:
                  `Foto de ${photoCategory.value}`

              })

            }
          );


        const saveData =
          await saveResponse.json();


        if (
          !saveResponse.ok ||
          !saveData.success
        ) {

          throw new Error(
            `A foto ${file.name} foi enviada para o R2, mas não foi cadastrada.`
          );

        }


        /* =============================================
           4. MOSTRAR ÚLTIMA FOTO ENVIADA
        ============================================= */

        preview.src =
          prepareData.publicUrl;

        imageInfo.textContent =
          file.name;

        imageUrl.textContent =
          prepareData.publicUrl;

        uploadedImage.style.display =
          "block";

      }


      status.textContent =
        `${files.length} foto(s) enviada(s) e cadastrada(s) com sucesso!`;


      /* ===============================================
         ATUALIZAR GALERIA DO PAINEL
      =============================================== */

      await loadPhotos();


    } catch (error) {

      console.error(error);

      status.textContent =
        error.message ||
        "Ocorreu um erro durante o upload.";

    } finally {

      uploadButton.disabled = false;

      photoFiles.value = "";

    }

  }
);

    /* =====================================================
       CARREGAR FOTOS
    ===================================================== */

    async function loadPhotos() {

      const photosList =
        document.getElementById("photos-list");


      try {

        const response =
          await fetch(
           "/.netlify/functions/list-all-photos"
          );


        const data =
          await response.json();


        if (!data.success) {

          photosList.innerHTML = `
            <div class="error-state">
              Não foi possível carregar as fotos.
            </div>
          `;

          return;

        }


        const photos =
          data.photos.filter(
            photo => photo.image
          );


        if (photos.length === 0) {

          photosList.innerHTML = `
            <div class="empty-state">
              Nenhuma foto cadastrada.
            </div>
          `;

          return;

        }


        photosList.innerHTML = "";


        photos.forEach(photo => {

          const item =
            document.createElement("article");


          item.className =
            "photo-card";


          item.innerHTML = `

            <div class="photo-preview">

              <img
                src="${photo.image}"
                alt="${photo.alt || "Fotografia"}"
                loading="lazy"
              >

            </div>


            <div class="photo-content">

              <p class="photo-filename">
                <strong>
                  ${photo.filename || photo.id}
                </strong>
              </p>


              <div class="photo-field">

                <label>
                  Categoria
                </label>

                <select class="edit-category">

                  <option
                    value="eventos"
                    ${photo.category === "eventos" ? "selected" : ""}
                  >
                    Eventos
                  </option>

                  <option
                    value="esportes"
                    ${photo.category === "esportes" ? "selected" : ""}
                  >
                    Esportes
                  </option>

                  <option
                    value="retratos"
                    ${photo.category === "retratos" ? "selected" : ""}
                  >
                    Retratos
                  </option>

                </select>

              </div>


              <div class="photo-field">

                <label>
                  Tamanho na galeria
                </label>

                <select class="edit-size">

                  <option
                    value="lg"
                    ${photo.size === "lg" ? "selected" : ""}
                  >
                    Grande
                  </option>

                  <option
                    value="sm"
                    ${photo.size === "sm" ? "selected" : ""}
                  >
                    Pequena
                  </option>

                  <option
                    value="wide"
                    ${photo.size === "wide" ? "selected" : ""}
                  >
                    Larga
                  </option>

                </select>

              </div>
              
              <div class="photo-field">

                <label>
                  Mostrar no site
                </label>

                <select class="edit-published">

                  <option
                    value="true"
                    ${photo.published !== false ? "selected" : ""}
                  >
                    Sim
                  </option>

                  <option
                    value="false"
                    ${photo.published === false ? "selected" : ""}
                  >
                    Não
                  </option>

                </select>

              </div>

              <div class="photo-actions">

                <button
                  type="button"
                  class="save-photo"
                >
                  Salvar
                </button>


                <button
                  type="button"
                  class="delete-photo"
                  data-id="${photo.id}"
                >
                  Excluir
                </button>

              </div>

            </div>

          `;


          photosList.appendChild(item);


          /* ===============================================
             ELEMENTOS DO CARD
          =============================================== */

          const deleteButton =
            item.querySelector(
              ".delete-photo"
            );


          const categorySelect =
            item.querySelector(
              ".edit-category"
            );


          const sizeSelect =
            item.querySelector(
              ".edit-size"
            );

          const publishedSelect =
  item.querySelector(
    ".edit-published"
  );


          const savePhotoButton =
            item.querySelector(
              ".save-photo"
            );


          /* ===============================================
             EXCLUIR
          =============================================== */

          deleteButton.addEventListener(
            "click",
            async () => {

              const confirmed =
                confirm(
                  "Tem certeza que deseja excluir esta foto?"
                );


              if (!confirmed) {
                return;
              }


              try {

                deleteButton.disabled =
                  true;

                deleteButton.textContent =
                  "Excluindo...";


                const response =
                  await fetch(
                    "/.netlify/functions/delete-photo",
                    {
                      method: "POST",

                      headers: {
                        "Content-Type":
                          "application/json"
                      },

                      body: JSON.stringify({
                        id: photo.id
                      })
                    }
                  );


                const data =
                  await response.json();


                if (!data.success) {

                  alert(
                    "Não foi possível excluir a foto."
                  );

                  deleteButton.disabled =
                    false;

                  deleteButton.textContent =
                    "Excluir";

                  return;

                }


                item.remove();


              } catch (error) {

                console.error(error);


                alert(
                  "Erro ao excluir a foto."
                );


                deleteButton.disabled =
                  false;

                deleteButton.textContent =
                  "Excluir";

              }

            }
          );


          /* ===============================================
             SALVAR ALTERAÇÕES
          =============================================== */

          savePhotoButton.addEventListener(
            "click",
            async () => {

              try {

                savePhotoButton.disabled =
                  true;

                savePhotoButton.textContent =
                  "Salvando...";


                const response =
                  await fetch(
                    "/.netlify/functions/update-photo",
                    {
                      method: "POST",

                      headers: {
                        "Content-Type":
                          "application/json"
                      },

                     body: JSON.stringify({

  id: photo.id,

  category:
    categorySelect.value,

  size:
    sizeSelect.value,

  published:
    publishedSelect.value === "true"

})
                    }
                  );


                const data =
                  await response.json();


                if (!data.success) {

                  alert(
                    "Não foi possível atualizar a foto."
                  );

                  return;

                }


                savePhotoButton.textContent =
                  "Salvo!";


                setTimeout(() => {

                  savePhotoButton.textContent =
                    "Salvar";

                }, 1500);


              } catch (error) {

                console.error(error);


                alert(
                  "Erro ao atualizar a foto."
                );


              } finally {

                savePhotoButton.disabled =
                  false;

              }

            }
          );

        });


      } catch (error) {

        console.error(error);


        photosList.innerHTML = `
          <div class="error-state">
            Erro ao carregar as fotos.
          </div>
        `;

      }

    }


    /* =====================================================
       INICIAR
    ===================================================== */

    loadPhotos();

  </script>

</body>
</html>
