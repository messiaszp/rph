<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login — Painel</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #121110;
      color: #ece8e0;
      font-family: Arial, sans-serif;
    }

    .login {
      width: min(420px, calc(100% - 40px));
      background: #1a1815;
      border: 1px solid rgba(236, 232, 224, 0.14);
      padding: 40px;
    }

    h1 {
      margin: 0 0 10px;
      text-align: center;
      font-family: Georgia, serif;
      font-weight: 400;
      font-size: 2rem;
    }

    .subtitle {
      margin: 0 0 30px;
      text-align: center;
      color: #a39c8e;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #c9c2b5;
      font-size: 14px;
    }

    input {
      width: 100%;
      height: 46px;
      margin-bottom: 20px;
      padding: 0 12px;
      border: 1px solid rgba(236, 232, 224, 0.2);
      background: #121110;
      color: #ece8e0;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #ab8f63;
    }

    button {
      width: 100%;
      height: 48px;
      border: 1px solid #ab8f63;
      background: #ab8f63;
      color: #121110;
      font-size: 15px;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: transparent;
      color: #ece8e0;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #message {
      min-height: 22px;
      margin-top: 20px;
      text-align: center;
      color: #a39c8e;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <main class="login">

    <h1>Painel do fotógrafo</h1>

    <p class="subtitle">
      Entre para acessar o gerenciamento de fotos.
    </p>

    <form id="login-form">

      <label for="email">
        E-mail
      </label>

      <input
        id="email"
        type="email"
        autocomplete="email"
        required
      >

      <label for="password">
        Senha
      </label>

      <input
        id="password"
        type="password"
        autocomplete="current-password"
        required
      >

      <button id="login-button" type="submit">
        Entrar
      </button>

      <p style="text-align: center; margin-top: 15px;">
        <a href="#" id="forgot-password" style="color: #ab8f63;">
          Esqueci minha senha
        </a>
      </p>
    </form>

    <div id="message"></div>

  </main>


  <script type="module">

   import {
  login,
  getUser,
  handleAuthCallback,
  resetPassword
} from "https://esm.sh/@netlify/identity";
    
    const form = document.getElementById("login-form");
    const button = document.getElementById("login-button");
    const message = document.getElementById("message");
    const forgotPassword =
  document.getElementById("forgot-password");

forgotPassword.addEventListener("click", async event => {

  event.preventDefault();

  const email =
    document.getElementById("email").value.trim();

  if (!email) {
    message.textContent =
      "Digite seu e-mail primeiro.";
    return;
  }

  try {

    await resetPassword(email);

    message.textContent =
      "Enviamos um link para redefinir sua senha.";

  } catch (error) {

    console.error(error);

    message.textContent =
      "Não foi possível enviar o link.";

  }

});


    async function initialize() {

      try {

        await handleAuthCallback();

        const user = await getUser();

        if (user) {
          window.location.href = "/admin/";
        }

      } catch (error) {

        console.error(error);

      }

    }


    form.addEventListener("submit", async event => {

      event.preventDefault();

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;

      button.disabled = true;
      button.textContent = "Entrando...";
      message.textContent = "";


      try {

        await login(email, password);

        message.textContent =
          "Login realizado. Abrindo painel...";

        window.location.href = "/admin/";

      } catch (error) {

        console.error(error);

        message.textContent =
          "E-mail ou senha incorretos.";

        button.disabled = false;
        button.textContent = "Entrar";

      }

    });


    initialize();

  </script>

</body>
</html>
