
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login — Painel</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #121110;
      color: #ece8e0;
      font-family: Arial, sans-serif;
    }

    .login {
      width: min(420px, calc(100% - 40px));
      background: #1a1815;
      border: 1px solid rgba(236, 232, 224, 0.14);
      padding: 40px;
    }

    h1 {
      margin: 0 0 10px;
      text-align: center;
      font-family: Georgia, serif;
      font-weight: 400;
      font-size: 2rem;
    }

    .subtitle {
      margin: 0 0 30px;
      text-align: center;
      color: #a39c8e;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #c9c2b5;
      font-size: 14px;
    }

    input {
      width: 100%;
      height: 46px;
      margin-bottom: 20px;
      padding: 0 12px;
      border: 1px solid rgba(236, 232, 224, 0.2);
      background: #121110;
      color: #ece8e0;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #ab8f63;
    }

    button {
      width: 100%;
      height: 48px;
      border: 1px solid #ab8f63;
      background: #ab8f63;
      color: #121110;
      font-size: 15px;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: transparent;
      color: #ece8e0;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #message {
      min-height: 22px;
      margin-top: 20px;
      text-align: center;
      color: #a39c8e;
      font-size: 14px;
    }

    .hidden {
      display: none;
    }

    .forgot {
      text-align: center;
      margin-top: 15px;
    }

    .forgot a {
      color: #ab8f63;
      text-decoration: none;
    }

    .forgot a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <main class="login">

    <h1>Painel do fotógrafo</h1>

    <p class="subtitle" id="subtitle">
      Entre para acessar o gerenciamento de fotos.
    </p>


    <!-- LOGIN -->

    <section id="login-section">

      <form id="login-form">

        <label for="email">
          E-mail
        </label>

        <input
          id="email"
          type="email"
          autocomplete="email"
          required
        >

        <label for="password">
          Senha
        </label>

        <input
          id="password"
          type="password"
          autocomplete="current-password"
          required
        >

        <button id="login-button" type="submit">
          Entrar
        </button>

      </form>

      <div class="forgot">
        <a href="#" id="forgot-password">
          Esqueci minha senha
        </a>
      </div>

    </section>


    <!-- NOVA SENHA -->

    <section id="reset-section" class="hidden">

      <form id="reset-form">

        <label for="new-password">
          Nova senha
        </label>

        <input
          id="new-password"
          type="password"
          autocomplete="new-password"
          minlength="8"
          required
        >

        <label for="confirm-password">
          Confirmar nova senha
        </label>

        <input
          id="confirm-password"
          type="password"
          autocomplete="new-password"
          minlength="8"
          required
        >

        <button id="reset-button" type="submit">
          Definir nova senha
        </button>

      </form>

    </section>


    <div id="message"></div>

  </main>


  <script type="module">

    import {
      login,
      getUser,
      handleAuthCallback,
      requestPasswordRecovery,
      updateUser
    } from "https://esm.sh/@netlify/identity";


    const loginSection =
      document.getElementById("login-section");

    const resetSection =
      document.getElementById("reset-section");

    const subtitle =
      document.getElementById("subtitle");

    const message =
      document.getElementById("message");

    const loginForm =
      document.getElementById("login-form");

    const loginButton =
      document.getElementById("login-button");

    const forgotPassword =
      document.getElementById("forgot-password");

    const resetForm =
      document.getElementById("reset-form");

    const resetButton =
      document.getElementById("reset-button");


    function showResetForm() {

      loginSection.classList.add("hidden");

      resetSection.classList.remove("hidden");

      subtitle.textContent =
        "Defina uma nova senha para acessar o painel.";

      message.textContent = "";

    }


    /*
      INICIALIZAÇÃO

      O handleAuthCallback() precisa ser executado
      quando a página recebe um recovery_token.
    */

    async function initialize() {

      try {

        const result =
          await handleAuthCallback();


        /*
          RECUPERAÇÃO DE SENHA

          O Netlify retorna:
          { type: "recovery", user: ... }

          Nesse momento mostramos o formulário
          para definir a nova senha.
        */

        if (result?.type === "recovery") {

          showResetForm();

          return;

        }


        /*
          LOGIN NORMAL

          Se não houve recuperação e já existe
          uma sessão válida, abre o painel.
        */

        const user =
          await getUser();

        if (user) {

          window.location.href =
            "/admin/";

        }

      } catch (error) {

        console.error(error);

        message.textContent =
          "Não foi possível processar este acesso.";

      }

    }


    /*
      LOGIN NORMAL
    */

    loginForm.addEventListener(
      "submit",
      async event => {

        event.preventDefault();

        const email =
          document.getElementById("email").value.trim();

        const password =
          document.getElementById("password").value;


        loginButton.disabled = true;

        loginButton.textContent =
          "Entrando...";

        message.textContent = "";


        try {

          await login(email, password);

          message.textContent =
            "Login realizado. Abrindo painel...";


          window.location.href =
            "/admin/";

        } catch (error) {

          console.error(error);

          message.textContent =
            "E-mail ou senha incorretos.";

          loginButton.disabled = false;

          loginButton.textContent =
            "Entrar";

        }

      }
    );


    /*
      SOLICITAR RECUPERAÇÃO
    */

    forgotPassword.addEventListener(
      "click",
      async event => {

        event.preventDefault();


        const email =
          document.getElementById("email").value.trim();


        if (!email) {

          message.textContent =
            "Digite seu e-mail primeiro.";

          return;

        }


        try {

          await requestPasswordRecovery(email);

          message.textContent =
            "Enviamos um link para redefinir sua senha.";

        } catch (error) {

          console.error(error);

          message.textContent =
            "Não foi possível enviar o link.";

        }

      }
    );


    /*
      DEFINIR NOVA SENHA
    */

    resetForm.addEventListener(
      "submit",
      async event => {

        event.preventDefault();


        const newPassword =
          document.getElementById("new-password").value;

        const confirmPassword =
          document.getElementById("confirm-password").value;


        if (newPassword !== confirmPassword) {

          message.textContent =
            "As senhas não são iguais.";

          return;

        }


        if (newPassword.length < 8) {

          message.textContent =
            "A senha deve ter pelo menos 8 caracteres.";

          return;

        }


        resetButton.disabled = true;

        resetButton.textContent =
          "Salvando...";

        message.textContent = "";


        try {

          /*
            Depois do recovery, o usuário já possui
            uma sessão temporária de recuperação.

            Agora definimos a nova senha.
          */

          await updateUser({
            password: newPassword
          });


          message.textContent =
            "Senha definida com sucesso!";


          setTimeout(() => {

            window.location.href =
              "/admin/";

          }, 1000);


        } catch (error) {

          console.error(error);

          message.textContent =
            "Não foi possível definir a nova senha.";

          resetButton.disabled = false;

          resetButton.textContent =
            "Definir nova senha";

        }

      }
    );


    initialize();

  </script>

</body>
</html>
